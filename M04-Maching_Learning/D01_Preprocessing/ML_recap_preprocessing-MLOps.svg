<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1330" viewBox="0 0 680 1330" font-family="Helvetica, Arial, sans-serif">
<title>Recap ML - preprocessing, modélisation et MLOps avec dérive</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:14px;font-weight:600}
.ts{font-size:12px}
.lbl{font-size:12px;fill:#5F5E5A}
.grp{font-size:12px;font-weight:600;fill:#444441}
.warn{font-size:12px;fill:#993C1D;font-weight:600}
.key{font-size:12px;fill:#854F0B;font-weight:600}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
.amber rect,.amber polygon{fill:#FAEEDA;stroke:#854F0B}.amber .th{fill:#633806}
</style>
</defs>
<rect width="680" height="1330" fill="#FFFFFF"/>
<text x="40" y="26" font-size="16" font-weight="600" fill="#2C2C2A">Recap ML · Preprocessing → Modélisation → MLOps (dérive)</text>
<text class="lbl" x="40" y="46">De la donnée brute au modèle en production, puis la boucle de réentraînement</text>

<!-- ============ 1 · PREPROCESSING ============ -->
<rect x="50" y="66" width="600" height="374" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<text class="grp" x="66" y="86">1 · PREPROCESSING</text>

<g class="teal"><rect x="60" y="96" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="112" text-anchor="middle" dominant-baseline="central">1 · Données brutes</text><text class="ts" x="200" y="130" text-anchor="middle" dominant-baseline="central">CSV, SQL, S3, API</text></g>
<text class="lbl" x="370" y="125">Charger, typer les colonnes (dtypes)</text>
<line x1="200" y1="146" x2="200" y2="158" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="60" y="160" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="176" text-anchor="middle" dominant-baseline="central">2 · EDA · exploration</text><text class="ts" x="200" y="194" text-anchor="middle" dominant-baseline="central">distributions, NaN, corrélations</text></g>
<text class="lbl" x="370" y="179">Choisir les traitements, repérer</text>
<text class="lbl" x="370" y="197">cible déséquilibrée, fuites de données</text>
<line x1="200" y1="210" x2="200" y2="222" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="60" y="224" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="240" text-anchor="middle" dominant-baseline="central">3 · Nettoyage</text><text class="ts" x="200" y="258" text-anchor="middle" dominant-baseline="central">doublons, erreurs, outliers</text></g>
<text class="lbl" x="370" y="243">Supprimer ou corriger les erreurs</text>
<text class="lbl" x="370" y="261">Imputation des NaN : après le split</text>
<line x1="200" y1="274" x2="200" y2="286" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="60" y="288" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="304" text-anchor="middle" dominant-baseline="central">4 · Split train / val / test</text><text class="ts" x="200" y="322" text-anchor="middle" dominant-baseline="central">train_test_split, stratify</text></g>
<text class="warn" x="370" y="317">⚠ Avant tout fit, sinon data leakage</text>
<line x1="200" y1="338" x2="200" y2="350" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="60" y="352" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="368" text-anchor="middle" dominant-baseline="central">5 · Transformations</text><text class="ts" x="200" y="386" text-anchor="middle" dominant-baseline="central">imputation, encodage, scaling</text></g>
<text class="lbl" x="370" y="371">OneHot / Ordinal · Standard / MinMax</text>
<text class="lbl" x="370" y="389">Création et sélection de features</text>

<text class="key" x="212" y="426">Pipeline + ColumnTransformer : fit(train) → transform(val, test, prod)</text>

<!-- ============ 2 · MODÉLISATION ============ -->
<line x1="200" y1="402" x2="200" y2="494" class="arr" marker-end="url(#arrow)"/>
<rect x="50" y="458" width="600" height="230" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<text class="grp" x="66" y="478">2 · MODÉLISATION</text>

<g class="purple"><rect x="60" y="496" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="512" text-anchor="middle" dominant-baseline="central">6 · Entraînement · fit</text><text class="ts" x="200" y="530" text-anchor="middle" dominant-baseline="central">cross-validation, GridSearch</text></g>
<text class="lbl" x="370" y="525">Hyperparamètres réglés sur val ou CV</text>
<line x1="200" y1="546" x2="200" y2="558" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="60" y="560" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="576" text-anchor="middle" dominant-baseline="central">7 · Évaluation sur test</text><text class="ts" x="200" y="594" text-anchor="middle" dominant-baseline="central">une seule fois, à la fin</text></g>
<text class="lbl" x="370" y="579">Régression : RMSE, MAE, R²</text>
<text class="lbl" x="370" y="597">Classification : F1, AUC, rappel</text>
<line x1="200" y1="610" x2="200" y2="622" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="60" y="624" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="640" text-anchor="middle" dominant-baseline="central">8 · Model registry · MLflow</text><text class="ts" x="200" y="658" text-anchor="middle" dominant-baseline="central">pipeline + modèle + métriques</text></g>
<text class="key" x="370" y="643">+ profil de référence des données</text>
<text class="key" x="370" y="661">d'entraînement (stats, histogrammes)</text>

<!-- ============ 3 · MLOPS ============ -->
<line x1="200" y1="674" x2="200" y2="736" class="arr" marker-end="url(#arrow)"/>
<rect x="50" y="706" width="600" height="516" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<text class="grp" x="66" y="724">3 · MLOPS · PRODUCTION ET DÉRIVE</text>

<g class="purple"><rect x="60" y="738" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="754" text-anchor="middle" dominant-baseline="central">9 · Déploiement</text><text class="ts" x="200" y="772" text-anchor="middle" dominant-baseline="central">API FastAPI ou batch · Docker</text></g>
<text class="lbl" x="370" y="757">Même preprocessing qu'à l'entraînement</text>
<text class="lbl" x="370" y="775">(un seul artefact : pipeline + modèle)</text>
<line x1="200" y1="788" x2="200" y2="800" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="60" y="802" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="818" text-anchor="middle" dominant-baseline="central">10 · Monitoring</text><text class="ts" x="200" y="836" text-anchor="middle" dominant-baseline="central">logs des entrées + prédictions</text></g>
<text class="lbl" x="370" y="821">Fenêtre glissante (jour, semaine)</text>
<text class="lbl" x="370" y="839">comparée au profil de référence</text>
<line x1="200" y1="852" x2="200" y2="864" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="60" y="866" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="882" text-anchor="middle" dominant-baseline="central">11 · Détection de dérive</text><text class="ts" x="200" y="900" text-anchor="middle" dominant-baseline="central">Evidently, tests statistiques</text></g>
<text class="lbl" x="370" y="885">Data drift, P(X) : KS, Chi², PSI</text>
<text class="lbl" x="370" y="903">Concept drift, P(y|X) : métriques ↓</text>
<line x1="200" y1="916" x2="200" y2="934" class="arr" marker-end="url(#arrow)"/>

<g class="amber"><polygon points="200,936 290,971 200,1006 110,971" stroke-width="0.8"/><text class="th" x="200" y="971" text-anchor="middle" dominant-baseline="central">Seuil dépassé ?</text></g>
<text class="lbl" x="298" y="966">non</text>
<text class="lbl" x="370" y="966">→ continuer à surveiller (étape 10)</text>
<text class="lbl" x="370" y="984">Seuils ex. : p-value &lt; 0,05, PSI &gt; 0,2</text>
<line x1="200" y1="1008" x2="200" y2="1028" class="arr" marker-end="url(#arrow)"/>
<text class="lbl" x="208" y="1022">oui</text>

<g class="coral"><rect x="60" y="1030" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="1046" text-anchor="middle" dominant-baseline="central">12 · Alerte + analyse</text><text class="ts" x="200" y="1064" text-anchor="middle" dominant-baseline="central">saisonnalité, bug ou vrai changement ?</text></g>
<text class="warn" x="370" y="1049">Bug de pipeline ≠ vraie dérive :</text>
<text class="warn" x="370" y="1067">corriger avant de réentraîner</text>
<line x1="200" y1="1080" x2="200" y2="1092" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="60" y="1094" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="1110" text-anchor="middle" dominant-baseline="central">13 · Réentraînement</text><text class="ts" x="200" y="1128" text-anchor="middle" dominant-baseline="central">même pipeline, données récentes</text></g>
<text class="lbl" x="370" y="1113">Rejoue les étapes 4 à 7</text>
<text class="lbl" x="370" y="1131">→ nouveau profil de référence</text>
<line x1="200" y1="1144" x2="200" y2="1156" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="60" y="1158" width="280" height="48" rx="8" stroke-width="0.8"/><text class="th" x="200" y="1174" text-anchor="middle" dominant-baseline="central">14 · Challenger vs champion</text><text class="ts" x="200" y="1192" text-anchor="middle" dominant-baseline="central">comparés sur des données récentes</text></g>
<text class="lbl" x="370" y="1177">Meilleur → promu dans le registre</text>
<text class="lbl" x="370" y="1195">Sinon : on garde le modèle actuel</text>

<!-- boucle de promotion -->
<path d="M58 1182 L36 1182 L36 648 L58 648" class="arr" marker-end="url(#arrow)"/>
<text class="lbl" x="30" y="915" text-anchor="middle" transform="rotate(-90 30 915)">promotion → redéploiement</text>

<!-- légende -->
<g class="teal"><rect x="40" y="1242" width="14" height="14" rx="3"/></g><text class="lbl" x="60" y="1253">données / stockage</text>
<g class="purple"><rect x="190" y="1242" width="14" height="14" rx="3"/></g><text class="lbl" x="210" y="1253">étape de code</text>
<g class="coral"><rect x="320" y="1242" width="14" height="14" rx="3"/></g><text class="lbl" x="340" y="1253">alerte / vigilance</text>
<g class="amber"><rect x="460" y="1242" width="14" height="14" rx="3"/></g><text class="lbl" x="480" y="1253">décision / à retenir</text>

<text class="lbl" x="40" y="1286">Règle d'or : fit sur train uniquement ; le même pipeline sert à l'entraînement et en prod</text>
<text class="lbl" x="40" y="1306">Data drift = P(X) change (sans labels) · Concept drift = P(y|X) change (labels requis)</text>
</svg>
